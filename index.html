<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手部衛生 Hand Hygiene</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0097a7;
    --teal-dark: #006978;
    --teal-light: #e0f7fa;
    --amber: #f9a825;
    --amber-light: #fff8e1;
    --red: #e53935;
    --white: #ffffff;
    --gray-100: #f5f5f5;
    --gray-700: #424242;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Noto Sans TC’, sans-serif;
background: linear-gradient(160deg, #e0f7fa 0%, #ffffff 50%, #fff8e1 100%);
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* ── Header ── */
header {
background: var(–teal);
color: white;
padding: 18px 24px 14px;
display: flex;
align-items: center;
justify-content: space-between;
box-shadow: 0 3px 12px rgba(0,151,167,.35);
position: sticky;
top: 0;
z-index: 100;
}

.header-left { display: flex; align-items: center; gap: 14px; }

.header-icon {
width: 48px; height: 48px;
background: white;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 24px;
flex-shrink: 0;
}

.header-title h1 {
font-size: 1.3rem;
font-weight: 900;
letter-spacing: 1px;
line-height: 1.2;
}
.header-title p {
font-size: 0.72rem;
opacity: 0.85;
letter-spacing: 0.5px;
}

/* Scan counter badge */
.scan-badge {
background: var(–amber);
color: #5d4037;
border-radius: 16px;
padding: 6px 16px;
text-align: center;
animation: popIn .6s .3s both;
flex-shrink: 0;
}
.scan-badge .count {
font-size: 1.8rem;
font-weight: 900;
line-height: 1;
font-family: ‘Bebas Neue’, sans-serif;
letter-spacing: 2px;
}
.scan-badge .label {
font-size: 0.6rem;
font-weight: 700;
letter-spacing: 0.5px;
opacity: 0.8;
}

/* ── Notice strip ── */
.notice {
background: var(–teal-light);
border-left: 4px solid var(–teal);
padding: 10px 20px;
font-size: 0.8rem;
color: var(–teal-dark);
display: flex;
align-items: center;
gap: 8px;
animation: slideDown .5s ease both;
}

/* ── PDF Viewer ── */
.pdf-container {
flex: 1;
display: flex;
flex-direction: column;
padding: 16px;
gap: 12px;
animation: fadeUp .6s .2s both;
}

.pdf-frame-wrap {
flex: 1;
border-radius: 16px;
overflow: hidden;
box-shadow: 0 8px 32px rgba(0,151,167,.18), 0 2px 8px rgba(0,0,0,.08);
background: white;
min-height: auto;
position: relative;
}

iframe {
width: 100%;
height: 100%;
min-height: auto;
border: none;
display: block;
}

/* Fallback download button (shown if iframe fails) */
.pdf-fallback {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
gap: 16px;
text-align: center;
min-height: 300px;
}
.pdf-fallback .icon { font-size: 56px; }
.pdf-fallback p { color: var(–gray-700); font-size: 0.95rem; line-height: 1.6; }

.btn-download {
display: inline-flex;
align-items: center;
gap: 8px;
background: var(–teal);
color: white;
padding: 14px 28px;
border-radius: 50px;
text-decoration: none;
font-weight: 700;
font-size: 1rem;
box-shadow: 0 4px 14px rgba(0,151,167,.4);
transition: transform .2s, box-shadow .2s;
}
.btn-download:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(0,151,167,.45);
}

/* ── Stats bar ── */
.stats-bar {
background: white;
border-radius: 14px;
padding: 14px 20px;
display: flex;
align-items: center;
justify-content: space-between;
box-shadow: 0 2px 10px rgba(0,0,0,.06);
flex-wrap: wrap;
gap: 10px;
}

.stat-item {
display: flex;
flex-direction: column;
align-items: center;
gap: 2px;
}
.stat-item .val {
font-size: 1.3rem;
font-weight: 900;
color: var(–teal);
font-family: ‘Bebas Neue’, sans-serif;
letter-spacing: 1px;
line-height: 1;
}
.stat-item .key {
font-size: 0.62rem;
color: #888;
letter-spacing: 0.3px;
}
.stat-divider { width: 1px; height: 32px; background: #eee; }

/* ── Footer ── */
footer {
text-align: center;
padding: 12px;
font-size: 0.68rem;
color: #aaa;
letter-spacing: 0.3px;
}

/* ── Animations ── */
@keyframes popIn {
from { transform: scale(.7); opacity: 0; }
to   { transform: scale(1);  opacity: 1; }
}
@keyframes slideDown {
from { transform: translateY(-16px); opacity: 0; }
to   { transform: translateY(0);     opacity: 1; }
}
@keyframes fadeUp {
from { transform: translateY(20px); opacity: 0; }
to   { transform: translateY(0);    opacity: 1; }
}

/* Mobile tweaks */
@media (max-width: 480px) {
.header-title h1 { font-size: 1.05rem; }
.scan-badge .count { font-size: 1.5rem; }
iframe, .pdf-frame-wrap { min-height: 65vh; }
}
</style>

</head>
